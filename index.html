<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pieces">
  <meta name="theme-color" content="#0f1115">
  <title>Piece Finder</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="toast" class="toast" hidden></div>
  <main id="view" class="view"></main>
  <nav id="tabs" class="tabs">
    <button type="button" class="tab" data-tab="find">Find</button>
    <button type="button" class="tab" data-tab="pieces">Pieces</button>
    <button type="button" class="tab" data-tab="poster">Poster</button>
    <button type="button" class="tab" data-tab="settings">Settings</button>
  </nav>
  <input id="file" type="file" accept="image/*" capture="environment" hidden>
  <input id="file-lib" type="file" accept="image/*" hidden>

  <script src="imgutil.js"></script>
  <script src="db.js"></script>
  <script src="segment.js"></script>
  <script src="sheet.js"></script>
  <script src="api.js"></script>
  <script src="poster.js"></script>
  <script src="app.js"></script>
  <script src="app-pieces.js"></script>
  <script src="app-find.js"></script>
  <script>document.addEventListener('DOMContentLoaded', function () { PF.app.init(); });</script>
</body>
</html>
