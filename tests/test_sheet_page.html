<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sheet.js test page</title>
<script src="../sheet.js"></script>
</head>
<body>
<p>Test page for sheet.js. It is driven by tests/test_sheet_build.mjs.</p>
<script>
// Browser-side helpers for the sheet tests: synthetic piece pictures and pixel readers.
window.T = (function () {
  // Small seeded random number generator (mulberry32) so every run makes the same pictures.
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Makes a canvas of a given size.
  function canvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    return c;
  }

  // Draws one jigsaw-like piece (square body, random tabs and blanks, colored picture) on a transparent layer.
  function pieceLayer(side, rnd, hue) {
    const L = Math.round(side * 1.6);
    const c = canvas(L, L);
    const g = c.getContext('2d');
    const cx = L / 2, cy = L / 2, r = side * 0.17;
    const sides = [[0, -1], [1, 0], [0, 1], [-1, 0]];
    const kinds = sides.map(() => (rnd() < 0.5 ? 1 : -1));
    g.fillStyle = '#888';
    g.fillRect(cx - side / 2, cy - side / 2, side, side);
    sides.forEach(([dx, dy], k) => {
      if (kinds[k] !== 1) return;
      g.beginPath();
      g.arc(cx + dx * (side / 2 + r * 0.7), cy + dy * (side / 2 + r * 0.7), r, 0, 7);
      g.fill();
    });
    g.globalCompositeOperation = 'destination-out';
    sides.forEach(([dx, dy], k) => {
      if (kinds[k] !== -1) return;
      g.beginPath();
      g.arc(cx + dx * (side / 2 - r * 0.7), cy + dy * (side / 2 - r * 0.7), r, 0, 7);
      g.fill();
    });
    g.globalCompositeOperation = 'source-atop';
    const grad = g.createLinearGradient(cx - side, cy - side, cx + side, cy + side);
    grad.addColorStop(0, `hsl(${hue} 70% 32%)`);
    grad.addColorStop(1, `hsl(${(hue + 50) % 360} 75% 62%)`);
    g.fillStyle = grad;
    g.fillRect(0, 0, L, L);
    for (let k = 0; k < 3; k++) {
      g.fillStyle = `hsla(${(hue + 180) % 360} 60% 35% / 0.45)`;
      g.fillRect(cx - side / 2 + rnd() * side, cy - side / 2, side * 0.09, side);
    }
    return c;
  }

  // Draws a layer onto a context at (x, y) center, rotated, with a soft shadow.
  function stamp(g, layer, x, y, angle) {
    g.save();
    g.translate(x, y);
    g.rotate(angle);
    g.shadowColor = 'rgba(0,0,0,0.35)';
    g.shadowBlur = 6;
    g.shadowOffsetX = 3; g.shadowOffsetY = 3;
    g.drawImage(layer, -layer.width / 2, -layer.height / 2);
    g.restore();
  }

  // Makes a piece thumbnail like the app makes: a bbox crop of a piece on paper or cloth, with a small tag.
  function makePiece(i, w, h, rnd, withTag) {
    const c = canvas(w, h);
    const g = c.getContext('2d');
    g.fillStyle = i % 3 === 0 ? '#3b3e44' : '#f7f6f1';
    g.fillRect(0, 0, w, h);
    const side = Math.min(w, h) * 0.55;
    stamp(g, pieceLayer(side, rnd, (i * 37) % 360), w / 2, h / 2, rnd() * Math.PI * 2);
    if (withTag) {
      g.font = '12px monospace';
      g.fillStyle = i % 3 === 0 ? '#fff' : '#000';
      g.fillText('p' + (i + 1), 4, 13);
    }
    return c;
  }

  // Makes a solid-color canvas.
  function solid(w, h, color) {
    const c = canvas(w, h);
    const g = c.getContext('2d');
    g.fillStyle = color;
    g.fillRect(0, 0, w, h);
    return c;
  }

  // Reads one pixel as [r, g, b, a].
  function px(c, x, y) {
    return Array.from(c.getContext('2d').getImageData(x, y, 1, 1).data);
  }

  // Finds the bounding box of pixels inside rect {x,y,w,h} that satisfy pred(r,g,b,a). Returns null if none.
  function inkBox(c, rect, pred) {
    const d = c.getContext('2d').getImageData(rect.x, rect.y, rect.w, rect.h);
    let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1, n = 0;
    for (let y = 0; y < rect.h; y++) {
      for (let x = 0; x < rect.w; x++) {
        const i = (y * rect.w + x) * 4;
        if (!pred(d.data[i], d.data[i + 1], d.data[i + 2], d.data[i + 3])) continue;
        n++;
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
    if (!n) return null;
    return { x0: rect.x + x0, y0: rect.y + y0, x1: rect.x + x1, y1: rect.y + y1, n };
  }

  // Counts pixels inside rect that satisfy pred.
  function count(c, rect, pred) {
    const b = inkBox(c, rect, pred);
    return b ? b.n : 0;
  }

  // Returns the canvas as PNG base64 (no "data:" prefix).
  function png(c) {
    return c.toDataURL('image/png').split(',')[1];
  }

  // Returns a copy of the canvas scaled to a given width (aspect kept).
  function shrink(c, width) {
    const k = width / c.width;
    const o = canvas(width, Math.round(c.height * k));
    const g = o.getContext('2d');
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    g.drawImage(c, 0, 0, o.width, o.height);
    return o;
  }

  // Cuts the number strip of every cell out of a (possibly shrunk) sheet and stacks them in one tall picture.
  // `scale` = how much the sheet was shrunk. Used to test that numbers stay readable.
  function stripStack(sheet, cols, rows, cell, scale, grow) {
    const sw = Math.round(cell * scale), sh = Math.round(44 * scale);
    const gap = 14, pad = 20;
    const out = canvas((sw + 2 * pad) * grow, (cols * rows * (sh + gap) + pad) * grow);
    const g = out.getContext('2d');
    g.fillStyle = '#fff';
    g.fillRect(0, 0, out.width, out.height);
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    let n = 0;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const sx = Math.round(c * cell * scale), sy = Math.round((r * cell + cell - 44) * scale);
        g.drawImage(sheet, sx, sy, sw, sh, pad * grow, (pad + n * (sh + gap)) * grow, sw * grow, sh * grow);
        n++;
      }
    }
    return out;
  }

  return { rng, canvas, pieceLayer, stamp, makePiece, solid, px, inkBox, count, png, shrink, stripStack };
})();
</script>
</body>
</html>
